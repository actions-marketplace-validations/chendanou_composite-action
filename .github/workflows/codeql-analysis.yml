name: "Security Scan (CodeQL)"

on:
  push:
    branches: [ "main", "developer" ] # Adjust to match your primary branch names
  pull_request:
    branches: [ "main", "developer" ]
  schedule:
    - cron: '0 0 * * 0' # Automatically runs every Sunday at midnight to check for new zero-day vulnerabilities

jobs:
  analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Mandatory permission to upload results to the Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. Initialize the CodeQL tools and specify the language database
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'javascript-typescript'
          # Queries options: 'security-extended' or 'security-and-quality' can be added here if needed

      # 2. Re-create the project environment so CodeQL can map type dependencies
      - name: Install dependencies
        run: npm ci

      # 3. Perform the deep taint-tracking analysis and compile the dashboard metrics
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
